name: Release

# Pushing a tag such as v1.2.3 builds git-cleaner for every platform and
# publishes the archives on the GitHub release page (see .goreleaser.yaml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Nothing is published while the code reaches a known vulnerability. The scan
  # uses the same stable Go as the build a moment later.
  vulncheck:
    name: vulnerability scan
    uses: ./.github/workflows/vulncheck.yml

  goreleaser:
    needs: vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from the history

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
