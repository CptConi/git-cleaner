name: Branch policy

# main only receives merges from dev: pull requests into main from any other
# branch (or from a fork) fail the "source is dev" check, which the main
# ruleset requires (.github/rulesets/main.json).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  source-is-dev:
    name: source is dev
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != dev ] || [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Only the dev branch of $REPO can be merged into main (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
